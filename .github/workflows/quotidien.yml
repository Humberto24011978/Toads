name: Cartes du jour

# Chaque matin : météo des trois dernières semaines, cartes du jour, publication du site.
on:
  schedule:
    # Les déclenchements programmés de GitHub sont souvent retardés ou sautés : on en prévoit un par heure
    # (de 4 h à 21 h à Paris en hiver) ; chacun s'arrête aussitôt si le site affiche déjà la date du jour.
    - cron: "17 3-20 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Préparation des données"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "scripts/05_meteo.py", "scripts/indice_meteo.py", "scripts/commun.py", "requirements.txt"]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

env:
  TROUVAILLES: ${{ secrets.TROUVAILLES }}

jobs:
  controle:
    runs-on: ubuntu-latest
    outputs:
      faire: ${{ steps.verif.outputs.faire }}
    steps:
      - id: verif
        run: |
          # Déclenchement programmé : on ne refait pas la mise à jour si le site affiche déjà la date du jour (Paris)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "faire=oui" >> "$GITHUB_OUTPUT"; exit 0; fi
          aujourdhui=$(TZ=Europe/Paris date +%F)
          date_site=$(curl -fsS --max-time 30 "https://humberto24011978.github.io/Toads/cartes/info.json?t=$(date +%s)" | jq -r '.date // empty' || true)
          if [ "$date_site" = "$aujourdhui" ]; then echo "Site déjà à jour ($date_site)."; echo "faire=non" >> "$GITHUB_OUTPUT";
          else echo "Site du ${date_site:-?} : mise à jour."; echo "faire=oui" >> "$GITHUB_OUTPUT"; fi

  cartes:
    needs: controle
    if: needs.controle.outputs.faire == 'oui' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cartes du jour
        run: python scripts/05_meteo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
