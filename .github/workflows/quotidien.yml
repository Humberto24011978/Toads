name: Cartes du jour

# Chaque matin : météo des trois dernières semaines, cartes du jour, publication du site.
on:
  schedule:
    - cron: "17 4 * * *"   # vers 5 h 17 en hiver, 6 h 17 en été (heure de Paris)
  workflow_dispatch:
  workflow_run:
    workflows: ["Préparation des données"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "scripts/05_meteo.py", "scripts/indice_meteo.py", "scripts/commun.py", "requirements.txt"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TROUVAILLES: ${{ secrets.TROUVAILLES }}

jobs:
  cartes:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cartes du jour
        run: python scripts/05_meteo.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
