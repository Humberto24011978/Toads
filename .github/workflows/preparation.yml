name: Préparation des données

# Lancée à la main (onglet Actions). Télécharge les données ouvertes,
# calcule le potentiel de chaque carré de 250 m, puis enregistre le
# résultat dans le dossier data/ du dépôt.
on:
  workflow_dispatch:
    inputs:
      etapes:
        description: "Étapes, séparées par des virgules : tout, cartes, observations, occupation, relief, reserve-utile, europe, hauteur, acces, scores, reglages-meteo"
        type: string
        default: tout

permissions:
  contents: write

concurrency:
  group: preparation
  cancel-in-progress: false

env:
  TROUVAILLES: ${{ secrets.TROUVAILLES }}

jobs:
  preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 1. Observations (GBIF)
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'observations')
        run: python scripts/01_observations.py
      - name: 2. Occupation du sol et forêts (IGN)
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'cartes') || contains(inputs.etapes, 'occupation')
        run: python scripts/02_occupation.py
      - name: 3. Relief et sol (Copernicus, SoilGrids)
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'cartes') || contains(inputs.etapes, 'relief')
        run: python scripts/03_relief_sol.py
      - name: Réserve utile du sol (SoilGrids, relief)
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'cartes') || contains(inputs.etapes, 'relief') || contains(inputs.etapes, 'reserve-utile')
        run: python scripts/07_reserve_utile.py
      - name: Cartes européennes à 30 m (essences d'arbres, sol)
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'cartes') || contains(inputs.etapes, 'europe')
        run: python scripts/08_europe.py
      - name: Hauteur des arbres (LiDAR HD de l'IGN)
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'cartes') || contains(inputs.etapes, 'hauteur')
        run: python scripts/09_hauteur.py
      - name: Forêts publiques et zones protégées (IGN)
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'cartes') || contains(inputs.etapes, 'acces')
        run: python scripts/10_acces.py
      - name: 4. Scores par espèce
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'cartes') || contains(inputs.etapes, 'scores')
        run: python scripts/04_scores.py
      - name: 5. Réglages météo d'après les observations datées
        if: contains(inputs.etapes, 'tout') || contains(inputs.etapes, 'observations') || contains(inputs.etapes, 'reglages-meteo')
        run: python scripts/06_phenologie.py
      - name: Enregistrer les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Données mises à jour (${{ inputs.etapes }})"
          git pull --rebase
          git push
